# ─── Datasource ────────────────────────────────────────────────────────────────
# Default: H2 in-memory (local dev). Override all three for MySQL in production.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:expensedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Driver is auto-detected from the URL by Spring Boot — do not set manually.

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
# 'update': adds new columns/tables; never drops existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Serialize LocalDateTime as ISO string, not array
spring.jackson.serialization.write-dates-as-timestamps=false

# ─── H2 Console ────────────────────────────────────────────────────────────────
# Disable in production via H2_CONSOLE_ENABLED=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ─── JWT ───────────────────────────────────────────────────────────────────────
# IMPORTANT: Override JWT_SECRET in production with a long random string (>=32 chars)
jwt.secret=${JWT_SECRET:dev-only-secret-change-in-production-must-be-long!!}
# Web JWT expiry in ms (default: 24 hours)
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# ─── CORS ──────────────────────────────────────────────────────────────────────
# Comma-separated allowed frontend origins. Add production URL via env var.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# ─── Server Port ───────────────────────────────────────────────────────────────
# Render sets PORT automatically for deployed services.
server.port=${PORT:8080}